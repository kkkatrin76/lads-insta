<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>❤️&🪐 Insta</title>
    <script type="module" crossorigin src="/lads-insta/assets/index-BmDMWsBC.js"></script>
    <link rel="stylesheet" crossorigin href="/lads-insta/assets/index-DS7fFWBB.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      const repoBase = '/lads-insta';
      const pathname = window.location.pathname || '/';
      const hash = window.location.hash || '';
      const isRoot = pathname === '/' || pathname === repoBase || pathname === `${repoBase}/`;
      const hasHashRoute = hash.startsWith('#/');

      if (!hasHashRoute && !isRoot) {
        const relativePath = pathname.replace(new RegExp(`^${repoBase}/?`), '');
        const nextPath = relativePath ? `/#/${relativePath}` : '/';
        window.location.replace(`${window.location.origin}${repoBase}${nextPath}${window.location.search}`);
      }
    </script>
  </body>
</html>
